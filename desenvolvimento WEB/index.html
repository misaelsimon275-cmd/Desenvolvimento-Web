<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Sistema de Notas Acadêmicas</h1>
        
        <div class="form-group">
            <label for="nome">Nome do Estudante:</label>
            <input type="text" id="nome" placeholder="Digite o nome completo">
        </div>

        <div class="notas-grid">
            <div class="form-group">
                <label for="nota1">Nota 1 (0 a 10):</label>
                <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="Ex: 8.0">
            </div>
            <div class="form-group">
                <label for="nota2">Nota 2 (0 a 10):</label>
                <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="Ex: 7.0">
            </div>
            <div class="form-group">
                <label for="nota3">Nota 3 (0 a 10):</label>
                <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="Ex: 9.0">
            </div>
        </div>

        <div class="botoes">
            <button id="btn-calcular" onclick="calcularMedia()">Calcular Média</button>
            <button id="btn-limpar" onclick="reiniciarSistema()">Reiniciar / Limpar</button>
        </div>

        <div id="resultado-container" class="escondido">
            <h2>Resultado da Avaliação</h2>
            <p id="txt-nome"></p>
            <p id="txt-media"></p>
            <p id="txt-situacao"></p>
        </div>

        <div id="erro-msg" class="erro-escondido" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
